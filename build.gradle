plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def MOD_VERSION = project.mod_version
def ARCHIVE_NAME = project.archives_base_name
def COMPATIBLE_VERSIONS = '[26.1, 26.2)'

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file('src/main/resources/chiseledbookshelfvisualizer.accesswidener')
}

repositories {
    mavenCentral()
    maven {
        name = 'JitPack'
        url = uri('https://jitpack.io')
    }
    maven {
        name = 'Mod Menu'
        url = uri('https://maven.terraformersmc.com/')
    }
    maven {
        name = 'WispForest'
        url = uri('https://maven.wispforest.io/releases')
    }
    maven {
        name = 'anvianMaven'
        url = uri('https://maven.anvian.net/releases')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_api_version}"

    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation(annotationProcessor("io.wispforest:owo-lib:${project.owo_version}"))
    include "io.wispforest:owo-sentinel:${project.owo_version}"
    include(implementation('com.github.fracpete:romannumerals4j:0.0.1'))
    implementation "net.anvian.anvianslib:anvianslib-fabric-26.1:${project.anvianslib}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'anvianslib', project.anvianslib
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(
                'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'anvianslib': project.anvianslib
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (25 >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = 25
    }
}

java {
    def javaVersion = JavaVersion.toVersion(25)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register('printEnv') {
    doLast {
        def envFile = new File(System.getenv('GITHUB_ENV'))
        envFile.append("MOD_VERSION=${MOD_VERSION}\n")
        envFile.append("RELEASE_NAME=${ARCHIVE_NAME}-${MOD_VERSION}\n")
        envFile.append("GAME_VERSIONS=${COMPATIBLE_VERSIONS}\n")
    }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		maven {
			name = "Reposilite"
			url = uri(
				version.toString().endsWith("SNAPSHOT")
						? "https://maven.anvian.net/snapshots"
						: "https://maven.anvian.net/releases"
			)
			credentials {
				username = project.findProperty("reposilite.user") ?: System.getenv("REPOSILITE_USER")
				password = project.findProperty("reposilite.token") ?: System.getenv("REPOSILITE_TOKEN")
			}
		}
	}
}
